<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07060d">
<title>Universal Beatdown</title>
<style>
:root { --bg:#07060d; --ink:#f4f1ff; --dim:#a39fc0; --accent:#ffcc33; --hot:#ff4d4d; }
* { box-sizing: border-box; }
html, body {
	margin: 0; padding: 0; width: 100%; height: 100%;
	overflow: hidden; background: var(--bg); color: var(--ink);
	font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
	/* No pull-to-refresh, text selection, callouts or double-tap zoom while fighting */
	overscroll-behavior: none; touch-action: none;
	-webkit-user-select: none; user-select: none;
	-webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
#canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; outline: none; touch-action: none; }
#canvas:focus { outline: none; }

.overlay {
	position: fixed; inset: 0; z-index: 10;
	display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
	padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
	text-align: center;
	background: radial-gradient(ellipse at 50% 35%, #2a1d52 0%, var(--bg) 70%);
}
.overlay[hidden] { display: none; }
.logo { font-weight: 900; letter-spacing: .04em; line-height: .95; font-size: clamp(30px, 7vw, 64px); text-transform: uppercase; text-shadow: 0 4px 0 #000, 0 0 28px rgba(255,204,51,.35); }
.logo span { color: var(--accent); }
.bar { width: min(420px, 80vw); height: 14px; border: 3px solid #000; border-radius: 10px; background: #1b1830; overflow: hidden; box-shadow: 0 0 0 2px rgba(255,255,255,.15); }
.bar > i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--hot)); transition: width .15s; }
.note { color: var(--dim); font-size: 15px; max-width: 520px; line-height: 1.45; }
.note b { color: var(--ink); }
#tap {
	font: inherit; font-weight: 900; font-size: clamp(22px, 5vw, 34px); letter-spacing: .06em;
	color: #111; background: var(--accent); border: 4px solid #000; border-radius: 18px;
	padding: 18px 46px; cursor: pointer; box-shadow: 0 7px 0 #000, 0 0 40px rgba(255,204,51,.45);
	animation: pulse 1.4s ease-in-out infinite; touch-action: manipulation;
}
#tap:active { transform: translateY(5px); box-shadow: 0 2px 0 #000; }
@keyframes pulse { 50% { transform: scale(1.05); } }
.error h2 { color: var(--hot); margin: 0; font-size: clamp(20px, 4.5vw, 30px); }
a { color: var(--accent); }

/* Phone held upright: ask to rotate (the game is 16:9) */
#rotate { display: none; }
@media (orientation: portrait) and (pointer: coarse) {
	#rotate:not([hidden]) { display: flex; z-index: 20; }
}
.phone { width: 54px; height: 90px; border: 5px solid var(--ink); border-radius: 12px; animation: turn 1.8s ease-in-out infinite; }
@keyframes turn { 0%, 25% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
<canvas id="canvas" tabindex="0">Your browser does not support the canvas tag.</canvas>
<noscript><div class="overlay"><div class="error"><h2>JavaScript is required to play.</h2></div></div></noscript>

<!-- 1) Downloading -->
<div id="loading" class="overlay">
	<div class="logo">Universal<br><span>Beatdown</span></div>
	<div class="bar"><i id="progress"></i></div>
	<div class="note" id="loading-text">Loading the arena...</div>
</div>

<!-- 2) Tap to Start (unlocks audio on iPhone / Safari, enters fullscreen on Android) -->
<div id="start" class="overlay" hidden>
	<div class="logo">Universal<br><span>Beatdown</span></div>
	<button id="tap" type="button">TAP TO START</button>
	<div class="note" id="start-hint"></div>
</div>

<!-- 3) Errors / unsupported browser -->
<div id="error" class="overlay" hidden>
	<div class="logo">Universal<br><span>Beatdown</span></div>
	<div class="error"><h2 id="error-title">Your browser can't run the game</h2></div>
	<div class="note" id="error-text"></div>
	<div class="note"><a href="../">&larr; Back to the website</a></div>
</div>

<!-- Phone in portrait -->
<div id="rotate" class="overlay">
	<div class="phone"></div>
	<div class="note"><b>Turn your phone sideways</b> to play.</div>
</div>

<script src="index.js"></script>
<script>
(function () {
	'use strict';
	const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":2407340,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
	const GODOT_THREADS_ENABLED = false;

	const $ = (id) => document.getElementById(id);
	const isTouch = window.matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 1;
	const isApple = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

	function show(id) {
		for (const o of ['loading', 'start', 'error']) { $(o).hidden = (o !== id); }
	}

	function fail(title, text) {
		$('error-title').textContent = title;
		$('error-text').innerHTML = text;
		$('rotate').hidden = true;
		show('error');
	}

	// ---------- Fallback: WebGL 2 is required (Godot Compatibility renderer) ----------
	function hasWebGL2() {
		try {
			const c = document.createElement('canvas');
			return !!(window.WebGL2RenderingContext && c.getContext('webgl2'));
		} catch (e) { return false; }
	}

	if (!hasWebGL2()) {
		fail('WebGL 2 is not available',
			'<b>Please use Safari / Chrome on iOS 17+</b><br>On a computer, use an up-to-date Chrome, Edge, Firefox or Safari ' +
			'and make sure hardware acceleration is turned on.');
		return;
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		fail('Your browser is missing features', 'Missing: ' + missing.join(', ') +
			'<br><br><b>Please use Safari / Chrome on iOS 17+</b>, or a current desktop browser.');
		return;
	}

	// ---------- Download everything BEFORE the tap, so the tap starts instantly ----------
	const engine = new Engine(Object.assign({}, GODOT_CONFIG, {
		onProgress: function (current, total) {
			if (total > 0) {
				const pct = Math.min(100, Math.round(current / total * 100));
				$('progress').style.width = pct + '%';
				$('loading-text').textContent = 'Loading the arena... ' + pct + '%';
			}
		},
	}));
	const exe = GODOT_CONFIG.executable;
	const pack = GODOT_CONFIG.mainPack || (exe + '.pck');

	Promise.all([engine.init(exe), engine.preloadFile(pack, pack)]).then(function () {
		$('progress').style.width = '100%';
		$('start-hint').innerHTML = isTouch
			? 'Touch controls: <b>left thumb</b> = move, <b>right buttons</b> = attack / jump / block / moves.'
			: '<b>A / D</b> move &middot; <b>W</b> jump &middot; <b>S</b> crouch &middot; <b>F</b> block &middot; <b>Left Click</b> attack &middot; <b>1 2 3</b> moves &middot; <b>G</b> ultimate';
		show('start');
		$('tap').focus();
	}).catch(function (err) {
		console.error(err);
		fail('The game failed to load', 'Check your connection and reload the page.<br><small>' + String(err && err.message || err) + '</small>');
	});

	// ---------- Tap to Start ----------
	let started = false;
	function begin(ev) {
		if (started) { return; }
		started = true;
		if (ev) { ev.preventDefault(); }

		// iOS: play audio even with the silent switch on (Safari 16.4+), and unlock
		// WebAudio inside this user gesture (iOS blocks audio until the first tap).
		try { if (navigator.audioSession) { navigator.audioSession.type = 'playback'; } } catch (e) {}
		try {
			const AC = window.AudioContext || window.webkitAudioContext;
			if (AC) {
				const ctx = new AC();
				const src = ctx.createBufferSource();
				src.buffer = ctx.createBuffer(1, 1, 22050);
				src.connect(ctx.destination);
				src.start(0);
				ctx.resume().then(function () { setTimeout(function () { ctx.close(); }, 500); });
			}
		} catch (e) {}

		// Android / desktop: go fullscreen + landscape (iPhone has no fullscreen API; that's fine)
		if (isTouch && !isApple) {
			const el = document.documentElement;
			const req = el.requestFullscreen || el.webkitRequestFullscreen;
			if (req) {
				Promise.resolve(req.call(el, { navigationUI: 'hide' })).then(function () {
					if (screen.orientation && screen.orientation.lock) { screen.orientation.lock('landscape').catch(function () {}); }
				}).catch(function () {});
			}
		}

		$('start').hidden = true;
		$('loading').hidden = true;
		$('canvas').focus();
		engine.start({ args: ['--main-pack', pack] }).catch(function (err) {
			console.error(err);
			fail('The game crashed while starting', 'Reload the page to try again.<br><small>' + String(err && err.message || err) + '</small>');
		});
	}
	$('tap').addEventListener('click', begin);
	$('tap').addEventListener('touchend', begin, { passive: false });

	// iOS Safari: stop pinch-zoom / double-tap zoom on the game
	document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
	document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
})();
</script>
</body>
</html>
