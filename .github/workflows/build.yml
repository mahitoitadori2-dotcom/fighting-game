# Builds Universal Beatdown and publishes it.
#
# | Trigger                   | Builds          | Publishes                               |
# |---------------------------|-----------------|-----------------------------------------|
# | Push to main              | Web only        | GitHub Pages                            |
# | Pull request              | Web only        | Workflow artifact "web"                 |
# | Manual run (Run workflow) | All 4 platforms | Workflow artifacts + Pages (on main)    |
# | Push a tag v*             | All 4 platforms | GitHub Release with the zips attached   |
#
# Every push to main is exported and published to Pages, whatever it changes.
# Pull requests that only change notes (vault/, *.md) are skipped.
#     git tag v0.1.0
#     git push origin v0.1.0
name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths-ignore: ["vault/**", "**.md"]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  GODOT_STATUS: "stable"
  # Full build (all platforms) for tags and manual runs; web only otherwise.
  FULL: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}

# Pull requests: a new push cancels the old run. main and tags: a run is never
# cancelled (a Pages deploy is not stopped halfway); GitHub keeps only the newest
# waiting run, which holds every earlier change, so Pages always ends at main's head.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  export:
    name: Export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Select platforms
        run: |
          if [ "$FULL" = "true" ]; then
            echo "PLATFORMS=web windows linux macos" >> "$GITHUB_ENV"
            echo "CACHE_SET=all" >> "$GITHUB_ENV"
          else
            echo "PLATFORMS=web" >> "$GITHUB_ENV"
            echo "CACHE_SET=web" >> "$GITHUB_ENV"
          fi

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v6
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}-${{ env.CACHE_SET }}-v2

      - name: Install Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # shellcheck disable=SC2086  # PLATFORMS is a space-separated list
          tools/ci_install_godot.sh $PLATFORMS

      - name: Export
        run: |
          # shellcheck disable=SC2086  # PLATFORMS is a space-separated list
          tools/export_all.sh ~/godot/godot $PLATFORMS

      # Web only (push to main, pull request): keep the web game as an artifact for PRs.
      - name: Upload web build
        if: env.FULL != 'true' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: web
          path: web/play/

      # Full build: package every platform as a zip.
      - name: Package
        if: env.FULL == 'true'
        run: |
          NAME="UniversalBeatdown-${GITHUB_REF_NAME//\//-}"
          mkdir -p dist
          (cd build/windows && zip -q -r "../../dist/${NAME}-windows.zip" .)
          (cd build/linux && chmod +x UniversalBeatdown.x86_64 && zip -q -r "../../dist/${NAME}-linux.zip" .)
          cp build/macos/UniversalBeatdown.zip "dist/${NAME}-macos.zip"
          (cd web/play && zip -q -r "../../dist/${NAME}-web.zip" .)
          ls -la dist

      - name: Upload release zips
        if: env.FULL == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-zips
          path: dist/

      # The whole web/ folder is the website: landing page + the game in web/play/.
      - name: Upload website for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/

  pages:
    name: Publish to GitHub Pages
    needs: export
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  release:
    name: Create GitHub Release
    needs: export
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-zips
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            -R "$GITHUB_REPOSITORY" \
            --title "Universal Beatdown $GITHUB_REF_NAME" \
            --generate-notes
